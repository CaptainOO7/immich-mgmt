[project]
name = "immichctl"
version = "0.3.0"
description = "A command-line utility for managing Immich"
readme = "README.md"
authors = [
    { name = "egonever", email = "iron.junh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
immichctl = "immichctl:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
